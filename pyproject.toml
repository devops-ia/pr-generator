[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-generator"
version = "1.3.0"
description = "Automated PR creation from branch patterns across GitHub and Bitbucket"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "PyJWT[crypto]==2.13.0",
    "cryptography==50.0.0",
    "pyyaml==6.0.3",
    "kubernetes>=29.0.0",
    "prometheus-client>=0.21.0",
]

[project.scripts]
pr-generator = "pr_generator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/pr_generator/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
